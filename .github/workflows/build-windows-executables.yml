name: Build Windows Executables

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "backfill_engine.py"
      - "backfill_launcher.py"
      - "backfill_launcher_config.example.json"
      - "browser_connector.py"
      - "daily_engine.py"
      - "daily_run_status.py"
      - "dailyfill_launcher.py"
      - "dailyfill_launcher_config.example.json"
      - "daily_notify_agent.py"
      - "github_info.py"
      - "auth_manager.py"
      - "login_flows.py"
      - "browser_manager.py"
      - "slider_motion_tools.py"
      - "task_ledger.py"
      - "sync_backfill_engine.bat"
      - "sync_daily_engine.bat"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-windows-executables.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Embed Git SHA
        shell: pwsh
        run: |
          $sha = $env:GITHUB_SHA.Trim()
          if ($sha -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Invalid GITHUB_SHA: $sha"
          }

          @"
          """当前程序的构建版本信息。由 GitHub Actions 写入。"""

          GIT_SHA = "$sha"
          "@ | Set-Content -Path github_info.py -Encoding utf8

      - name: Check Python syntax
        run: >
          uv run python -m py_compile
          backfill_engine.py
          backfill_launcher.py
          browser_connector.py
          daily_engine.py
          daily_run_status.py
          dailyfill_launcher.py
          daily_notify_agent.py
          github_info.py
          auth_manager.py
          login_flows.py
          browser_manager.py
          slider_motion_tools.py
          task_ledger.py

      - name: Build Backfill EXE
        run: >
          uv run pyinstaller
          --clean
          --onefile
          --name backfill_engine
          backfill_engine.py

      - name: Build Daily EXE
        run: >
          uv run pyinstaller
          --clean
          --onefile
          --noconsole
          --name daily_engine
          daily_engine.py

      - name: Build Daily Notify Agent EXE
        run: >
          uv run pyinstaller
          --clean
          --onefile
          --name daily_notify_agent
          daily_notify_agent.py

      - name: Build Backfill Launcher EXE
        run: >
          uv run pyinstaller
          --clean
          --onefile
          --noconsole
          --name backfill_launcher
          backfill_launcher.py

      - name: Build Dailyfill Launcher EXE
        run: >
          uv run pyinstaller
          --clean
          --onefile
          --noconsole
          --name dailyfill_launcher
          dailyfill_launcher.py

      - name: Prepare launcher packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path backfill-deployment-package\backfill\_release -Force
          Copy-Item dist\backfill_launcher.exe backfill-deployment-package\
          Copy-Item dist\backfill_engine.exe backfill-deployment-package\backfill\_release\
          Copy-Item backfill_launcher_config.example.json backfill-deployment-package\backfill\_release\backfill_launcher_config.json
          Copy-Item sync_backfill_engine.bat backfill-deployment-package\backfill\

          New-Item -ItemType Directory -Path dailyfill-deployment-package\dailyfill\_release -Force
          Copy-Item dist\dailyfill_launcher.exe dailyfill-deployment-package\
          Copy-Item dist\daily_engine.exe dailyfill-deployment-package\dailyfill\_release\
          Copy-Item dailyfill_launcher_config.example.json dailyfill-deployment-package\dailyfill\_release\dailyfill_launcher_config.json
          Copy-Item sync_daily_engine.bat dailyfill-deployment-package\dailyfill\

      - name: Upload Backfill EXE
        uses: actions/upload-artifact@v7
        with:
          name: backfill-engine-windows
          path: dist/backfill_engine.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload Daily EXE
        uses: actions/upload-artifact@v7
        with:
          name: daily-engine-windows
          path: dist/daily_engine.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload Daily Notify Agent EXE
        uses: actions/upload-artifact@v7
        with:
          name: daily-notify-agent-windows
          path: dist/daily_notify_agent.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload Backfill deployment package
        uses: actions/upload-artifact@v7
        with:
          name: backfill-deployment-windows
          path: backfill-deployment-package/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Dailyfill deployment package
        uses: actions/upload-artifact@v7
        with:
          name: dailyfill-deployment-windows
          path: dailyfill-deployment-package/
          if-no-files-found: error
          retention-days: 30
