name: Build Backfill Launcher Test

on:
  workflow_dispatch:

  push:
    branches:
      - test
    paths:
      - "backfill_launcher.py"
      - "backfill_launcher_config.example.json"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-backfill-launcher-test.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check Python syntax
        run: uv run python -m py_compile backfill_launcher.py

      - name: Build Backfill Launcher EXE
        run: >
          uv run pyinstaller
          --clean
          --onefile
          --noconsole
          --name backfill_launcher
          backfill_launcher.py

      - name: Prepare test package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path launcher-package
          Copy-Item dist\backfill_launcher.exe launcher-package\
          Copy-Item backfill_launcher_config.example.json launcher-package\backfill_launcher_config.json

      - name: Upload Backfill Launcher test package
        uses: actions/upload-artifact@v7
        with:
          name: backfill-launcher-windows-test
          path: launcher-package/
          if-no-files-found: error
          retention-days: 30
