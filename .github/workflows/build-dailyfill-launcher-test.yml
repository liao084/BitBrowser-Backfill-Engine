name: Build Dailyfill Deployment Test

on:
  workflow_dispatch:

  push:
    branches:
      - test
    paths:
      - "dailyfill_launcher.py"
      - "dailyfill_launcher_config.example.json"
      - "daily_engine.py"
      - "backfill_engine.py"
      - "browser_connector.py"
      - "auth_manager.py"
      - "browser_manager.py"
      - "task_ledger.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-dailyfill-launcher-test.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check Python syntax
        run: >
          uv run python -m py_compile
          dailyfill_launcher.py
          daily_engine.py
          backfill_engine.py
          browser_connector.py
          auth_manager.py
          browser_manager.py
          task_ledger.py

      - name: Build Dailyfill Launcher EXE
        run: >
          uv run pyinstaller
          --clean
          --onefile
          --noconsole
          --name dailyfill_launcher
          dailyfill_launcher.py

      - name: Build Daily Engine EXE
        run: >
          uv run pyinstaller
          --clean
          --onefile
          --noconsole
          --name daily_engine
          daily_engine.py

      - name: Prepare test package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path launcher-package\dailyfill\_release -Force
          Copy-Item dist\dailyfill_launcher.exe launcher-package\
          Copy-Item dist\daily_engine.exe launcher-package\dailyfill\_release\
          Copy-Item dailyfill_launcher_config.example.json launcher-package\dailyfill\_release\dailyfill_launcher_config.json

      - name: Upload Dailyfill Launcher test package
        uses: actions/upload-artifact@v7
        with:
          name: dailyfill-deployment-windows-test
          path: launcher-package/
          if-no-files-found: error
          retention-days: 30
